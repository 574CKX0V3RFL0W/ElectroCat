<!doctype html><html><head><meta charset="utf-8"><style>
body{font:13px Arial,sans-serif;margin:0;background:#f4f7f8;color:#173043;width:360px;max-height:580px;overflow:auto}
header{background:#142e3f;color:white;padding:16px;font-size:21px;font-weight:bold}
header b{color:#f1b35d}.wrap{padding:16px}label{display:block;font-weight:bold;font-size:11px;color:#55707b;margin-bottom:12px}
input{display:block;width:100%;box-sizing:border-box;border:1px solid #d4e1e5;border-radius:7px;padding:10px;margin-top:6px;font:13px Arial}
button{display:block;width:100%;margin:10px 0;border:0;border-radius:8px;padding:11px;background:#efb151;color:#172c3b;font-weight:bold;cursor:pointer}
a{display:block;text-align:center;color:#227d83;padding:5px}#message{color:#667d87;font-size:11px;line-height:1.5}.secondary{background:#dce9eb;color:#245662}.hidden{display:none}.batch{border-top:1px solid #dce5e7;margin-top:13px;padding-top:10px}.batch h3{font-size:12px;margin:0 0 8px}.listing{display:grid;grid-template-columns:18px 1fr;gap:7px;align-items:start;font-weight:normal;background:#fff;border:1px solid #dde7e9;border-radius:7px;padding:8px;margin:6px 0}.listing input{width:auto;margin:2px 0}.listing span{font-size:11px;line-height:1.3}.summary{display:flex;justify-content:space-between;align-items:center;color:#6d838c;font-size:10px}
</style></head><body>
<header>Electro<b>Cat</b></header><div class="wrap">
<label>Component name<input id="name" placeholder="AO3400A"></label>
<label>Listing URL<input id="url" placeholder="https://…"></label>
<button id="add">＋ Add to my parts list</button>
<button id="scan" class="secondary">Scan visible listings on this page</button>
<section id="batch" class="batch hidden"><div class="summary"><h3>New entries from listings</h3><span id="batch-count"></span></div><div id="listings"></div><button id="add-selected">＋ Add selected entries</button></section>
<a href="http://127.0.0.1:8765/" target="_blank">Open inventory ↗</a>
<p id="message">Start the ElectroCat Windows app first.</p>
</div><script src="popup.js"></script></body></html>
